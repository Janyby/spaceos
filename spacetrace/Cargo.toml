[package]
name = "spacetrace"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
parking_lot = "0.12"

# ETW consumer APIs (Stage 3 backend only). Already in the local registry
# cache (see filesystem-provider); strictly Windows-gated so non-Windows
# builds never see this dependency.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Etw", "Win32_System_Time"] }

# No space-core dependency to avoid cyclic dependency.
# Hooks use serde_json::Value and string identifiers instead.