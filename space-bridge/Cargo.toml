[package]
name = "space-bridge"
version = "0.1.0"
edition = "2021"

[features]
# Synthetic bootstrap adapters are never part of the normal production build.
mvp-lab-runtime = []

[[bin]]
name = "mvp-runtime-fixture"
path = "src/bin/mvp-runtime-fixture.rs"
required-features = ["mvp-lab-runtime"]

[[bin]]
name = "mvp-core-fixture"
path = "src/bin/mvp-core-fixture.rs"
required-features = ["mvp-lab-runtime"]

[[bin]]
name = "isolated-core-fixture"
path = "src/bin/isolated-core-fixture.rs"
required-features = ["mvp-lab-runtime"]

[[bin]]
name = "isolated-bridge-fixture"
path = "src/bin/isolated-bridge-fixture.rs"
required-features = ["mvp-lab-runtime"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
space-core = { path = "../space-core" }
spacetrace = { path = "../spacetrace" }
base64 = "0.22"

[dev-dependencies]
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes"] }
